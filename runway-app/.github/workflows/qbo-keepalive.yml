# The QuickBooks keep-alive, monthly.
#
# WHERE THIS FILE HAS TO LIVE: `.github/workflows/` at the ROOT OF THE REPOSITORY. The app itself sits
# in a `runway-app/` subdirectory, so the repo root is one level ABOVE the app — which is why every
# step below runs with `working-directory: runway-app`.
#
# The copy of this file that arrives inside `runway-app/.github/` in a release archive is INERT: GitHub
# reads workflows only from the repository root, with no error anywhere if they are somewhere else. It
# is shipped there so the file is version-controlled next to the code it runs; the live one is the copy
# at the root. If they ever disagree, the root one is what actually happens.
#
# THE SCHEDULER IS ALSO THE ALERTING CHANNEL. `qbo-keepalive.mjs` exits non-zero when something needs
# a person, GitHub marks the run failed, and GitHub emails whoever owns the repository. No webhook to
# maintain, no vendor to pay, and a notification path that already exists and is already watched.
#
# WHY MONTHLY AND NOT YEARLY: a refresh token dies after ~100 idle days, and only a ROTATION issues one
# with a fresh window. Monthly catches a rotation with two months to spare.
#
# WHY THE 4th AND NOT THE 1st: the 1st of the month is when every scheduled job on GitHub runs, and
# cron there is best-effort under load. Nothing here needs a particular day; it needs to have happened.
name: QuickBooks keep-alive

on:
  schedule:
    - cron: "17 9 4 * *"     # 09:17 UTC on the 4th
  workflow_dispatch:          # and on demand, which is how you test it

jobs:
  keepalive:
    runs-on: ubuntu-latest
    # Job-level rather than per-step, so anything added later inherits it. A step that forgets would
    # fail with "Cannot find module", which names the path and is at least self-explanatory.
    defaults:
      run:
        working-directory: runway-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No `npm ci`: this script uses only the standard library. Installing the whole toolchain to
      # make two fetch calls would be a slower job with more ways to break.
      - name: Refresh connections and report health
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QBO_CRON_SECRET: ${{ secrets.QBO_CRON_SECRET }}
        run: node scripts/qbo-keepalive.mjs
